name: Bug report
description: Report unexpected behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For security issues, use private vulnerability reporting instead.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Rust/Cargo versions, Janus revision
      placeholder: "Ubuntu 24.04, rustc 1.83, commit abc123"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
