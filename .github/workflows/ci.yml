name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        run: cargo test --workspace
      - name: Cargo check
        run: cargo check --workspace --all-targets
      - name: Docker build and TCP smoke test
        run: |
          docker build -t janus:ci .
          docker run --rm -d --name janus-ci-smoke -p 16380:6380 janus:ci
          cleanup() { docker stop janus-ci-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          python3 - <<'PY'
          import socket
          import time

          request = (
              b"*3\r\n$3\r\nSET\r\n$3\r\nkey\r\n$5\r\nvalue\r\n"
              b"*2\r\n$3\r\nGET\r\n$3\r\nkey\r\n"
          )
          expected = b"+OK\r\n$5\r\nvalue\r\n"
          deadline = time.monotonic() + 30
          while True:
              try:
                  with socket.create_connection(("127.0.0.1", 16380), timeout=2) as client:
                      client.settimeout(2)
                      client.sendall(request)
                      response = bytearray()
                      while expected not in response:
                          chunk = client.recv(128)
                          if not chunk:
                              break
                          response.extend(chunk)
                      if expected not in response:
                          raise RuntimeError(f"unexpected RESP response: {bytes(response)!r}")
                      break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.5)
          PY

  no-tool-coauthor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tool co-author trailers
        run: |
          chmod +x scripts/check-no-tool-coauthor.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50 || true
            ./scripts/check-no-tool-coauthor.sh "origin/${{ github.base_ref }}...HEAD"
          else
            ./scripts/check-no-tool-coauthor.sh HEAD~20..HEAD || ./scripts/check-no-tool-coauthor.sh HEAD
          fi
