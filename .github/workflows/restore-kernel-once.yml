name: restore-kernel-once
on:
  push:
    paths:
      - "src/kernel/_restore/TRIGGER"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and commit kernel.rs
        env:
          BRANCH: feat/f11-01-kernel-traces
        run: |
          set -euo pipefail
          git checkout "$BRANCH"
          cat src/kernel/_restore/p0.inc src/kernel/_restore/p1.inc src/kernel/_restore/p2.inc src/kernel/_restore/p3.inc src/kernel/_restore/p4.inc src/kernel/_restore/p5.inc src/kernel/_restore/p6.inc > src/kernel/kernel.rs
          test "$(wc -c < src/kernel/kernel.rs)" -eq 49164
          python3 -c "c=open('src/kernel/kernel.rs').read(); assert len(c)==49158; import hashlib; assert hashlib.sha256(c.encode()).hexdigest()=='7a21a6ee10b4e99733540a2ffa948eda60f4e1e6deee6d3388467d3cc21b433d'"
          grep -q 'fn traces_reports_set_get_spans_in_order' src/kernel/kernel.rs
          grep -q 'fn multi_queued_commands_span_only_on_exec_apply' src/kernel/kernel.rs
          grep -q 'fn traces_ring_buffer_drops_oldest_on_overflow' src/kernel/kernel.rs
          grep -q 'Command::Traces' src/kernel/kernel.rs
          grep -q 'TRACE_CAPACITY' src/kernel/kernel.rs
          rm -rf src/kernel/_restore
          rm -f .github/workflows/restore-kernel-once.yml
          rm -f src/kernel/_size_test.txt
          git config user.name "Samuel Fabel"
          git config user.email "samuelfabel@hotmail.com"
          git add -A
          git status
          MSG_FILE=$(mktemp)
          cat > "$MSG_FILE" <<'EOF'
feat(f11-01): add Kernel span ring buffer and Traces command

Record pedagogical spans on applied commands (MULTI queue spans only
on Exec apply). Command::Traces returns a # Traces text payload via
Response::Value. Capacity 64 drops oldest entries.
EOF
          git commit -F "$MSG_FILE"
          git push origin "HEAD:$BRANCH"
