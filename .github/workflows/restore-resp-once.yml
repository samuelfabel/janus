name: restore-resp-once
on:
  push:
    paths:
      - "src/serializer/_restore/TRIGGER"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and commit resp.rs
        env:
          BRANCH: feat/f10-02-resp-info
        run: |
          set -euo pipefail
          git checkout "$BRANCH"
          cat src/serializer/_restore/p0.inc src/serializer/_restore/p1.inc src/serializer/_restore/p2.inc src/serializer/_restore/p3.inc src/serializer/_restore/p4.inc src/serializer/_restore/p5.inc > src/serializer/resp.rs
          test "$(wc -c < src/serializer/resp.rs)" -eq 26504
          python3 -c "c=open('src/serializer/resp.rs').read(); assert len(c)==26502; import hashlib; assert hashlib.sha256(c.encode()).hexdigest()=='33c36febe4a74bad5a095b412cade707f70d352755116be83cc1eb114e612a60'"
          grep -q 'Command::Info' src/serializer/resp.rs
          grep -q 'decode_info_fixture' src/serializer/resp.rs
          grep -q 'INFO arity' src/serializer/resp.rs
          rm -rf src/serializer/_restore
          rm -f .github/workflows/restore-resp-once.yml
          git config user.name "Samuel Fabel"
          git config user.email "samuelfabel@hotmail.com"
          git add -A
          git status
          MSG_FILE=$(mktemp)
          printf '%s\n' 'feat(f10-02): decode RESP INFO and encode Info bulk response' > "$MSG_FILE"
          git commit -F "$MSG_FILE"
          git push origin "HEAD:$BRANCH"
