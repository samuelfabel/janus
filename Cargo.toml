[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/samuelfabel/janus"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync"] }
janus-types = { path = "crates/janus-types" }
janus-storage = { path = "crates/janus-storage" }
janus-kernel = { path = "crates/janus-kernel" }
janus-serializer = { path = "crates/janus-serializer" }
janus-protocol = { path = "crates/janus-protocol" }
janus-transport = { path = "crates/janus-transport" }
janus-http3 = { path = "crates/janus-http3" }
janus-capnp-rpc = { path = "crates/janus-capnp-rpc", default-features = false }
janus-grpc = { path = "crates/janus-grpc", default-features = false }
janus-rest = { path = "crates/janus-rest" }
http = "1"
bytes = "1"
serde_json = "1"

[package]
name = "janus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A modular data kernel written in Rust"
readme = "README.md"
keywords = ["cache", "storage", "kernel", "resp"]
categories = ["database-implementations", "network-programming"]

[features]
default = []
capnp = ["dep:janus-capnp-rpc", "janus-capnp-rpc/rpc"]
grpc = ["dep:janus-grpc", "janus-grpc/rpc"]
rest = ["dep:janus-rest"]

[dependencies]
tokio = { workspace = true }
janus-storage = { workspace = true }
janus-kernel = { workspace = true }
janus-transport = { workspace = true }
janus-http3 = { workspace = true }
janus-protocol = { workspace = true }
janus-capnp-rpc = { workspace = true, optional = true, default-features = false }
janus-grpc = { workspace = true, optional = true, default-features = false }
janus-rest = { workspace = true, optional = true }

[dev-dependencies]
bytes = { workspace = true }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http = { workspace = true }
janus-types = { workspace = true }
janus-protocol = { workspace = true }
janus-serializer = { workspace = true }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
