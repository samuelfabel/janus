[package]
name = "janus-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional gRPC interface for Janus"
build = "build.rs"

[features]
default = []
rpc = ["dep:prost", "dep:tokio-stream", "dep:tonic", "dep:tonic-prost"]

[dependencies]
janus-kernel = { workspace = true }
janus-protocol = { workspace = true }
janus-types = { workspace = true }
tokio = { workspace = true }
prost = { version = "=0.14.4", optional = true }
tokio-stream = { version = "=0.1.18", features = ["net"], optional = true }
tonic = { version = "=0.14.9", features = ["transport"], optional = true }
tonic-prost = { version = "=0.14.6", optional = true }

[build-dependencies]
tonic-prost-build = "=0.14.7"

[dev-dependencies]
janus-storage = { workspace = true }
janus-transport = { workspace = true }
